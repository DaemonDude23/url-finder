name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # renovate: datasource=go depName=github.com/rhysd/actionlint
  ACTIONLINT_VERSION: v1.7.12
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: v1.1.4
jobs:
  check:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Select checks for this change
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          go=true
          workflow=true
          docker=true
          # Required checks must still report success on documentation-only
          # PRs. Scope steps inside the job, never the workflow trigger.
          if [[ "$CI_EVENT_NAME" = pull_request ]] && git diff --name-only -z HEAD^ HEAD > "$RUNNER_TEMP/ci-paths"; then
            go=false
            workflow=false
            docker=false
            while IFS= read -r -d '' path; do
              case "$path" in
                src/*|.vscode/*|.github/workflows/ci.yaml) go=true ;;
              esac
              case "$path" in
                .github/workflows/*|scripts/*|.goreleaser.yaml) workflow=true ;;
              esac
              case "$path" in
                Dockerfile|Dockerfile.*|Dockerfile-dev|.dockerignore|src/*|.github/workflows/ci.yaml) docker=true ;;
              esac
            done < "$RUNNER_TEMP/ci-paths"
          fi
          printf 'go=%s\nworkflow=%s\ndocker=%s\n' "$go" "$workflow" "$docker" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.scope.outputs.go == 'true' || steps.scope.outputs.workflow == 'true'
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: src/go.sum
      - name: Format, vet, race tests, modules, and cross builds
        if: steps.scope.outputs.go == 'true'
        working-directory: src
        run: |
          test -z "$(gofmt -l ./*.go)"
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test -race -cover ./...
          for target in linux/amd64 linux/arm64 linux/386 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 windows/386; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /tmp/url-finder-check .
          done
      - name: Go vulnerability check
        if: steps.scope.outputs.go == 'true'
        working-directory: src
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}"
          govulncheck ./...
      - name: Release automation tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Workflow and shell syntax
        if: steps.scope.outputs.workflow == 'true'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@"${ACTIONLINT_VERSION}"
          actionlint
          shellcheck scripts/*.sh
      - name: GoReleaser configuration
        if: steps.scope.outputs.workflow == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.3
          args: check
      - name: Docker image builds
        if: steps.scope.outputs.docker == 'true'
        # Base image bumps auto-merge, so build both images (native arch only)
        # before merge instead of first discovering a break in the release run.
        run: |
          docker build --build-arg VERSION=0.0.0-ci -t url-finder-ci .
          docker build --build-arg VERSION=0.0.0-ci -f Dockerfile-dev -t url-finder-dev-ci .
          test "$(docker run --rm url-finder-ci --version)" = "url-finder 0.0.0-ci"
          docker run --rm --entrypoint /app/url-finder url-finder-dev-ci --version
